<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欧乐家 · 微信营销内容日历</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --line:#E5E7EB; --line2:#F1F2F4;
  --tx:#1F2328; --tx2:#5B6470; --tx3:#8A94A0;
  --brand:#C8511B; --brand-l:#FDF3EE;
  --wx:#07C160; --wx-bubble:#95EC69;
  --daily:#3B82F6; --festival:#EF4444; --case:#10B981; --promo:#F59E0B;
  --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --shadow-lg:0 12px 32px rgba(16,24,40,.12);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--tx); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ---------- topbar ---------- */
.topbar{
  background:var(--card); border-bottom:1px solid var(--line);
  padding:16px 28px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:50;
}
.brand{display:flex;align-items:center;gap:14px}
.logo{
  width:42px;height:42px;border-radius:11px;flex:none;
  background:linear-gradient(135deg,#D9601F,#B23F12);
  color:#fff;font-size:20px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(200,81,27,.28);
}
.brand-txt h1{font-size:17px;font-weight:650;letter-spacing:-.2px}
.brand-txt p{font-size:12.5px;color:var(--tx3);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:12px}
.push-status{
  display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--tx2);
  background:var(--line2);padding:6px 12px;border-radius:20px;
}
.push-status .dot{width:7px;height:7px;border-radius:50%;background:#CBD2D9}
.push-status.on{background:#E8F9EF;color:#047A43}
.push-status.on .dot{background:var(--wx);box-shadow:0 0 0 3px rgba(7,193,96,.16)}
.btn-ghost{
  background:var(--card);border:1px solid var(--line);color:var(--tx2);
  padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;
  font-family:inherit;transition:.15s;
}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-l)}
.btn-ghost.sm{padding:5px 11px;font-size:12.5px}

/* ---------- stats ---------- */
.stats{padding:20px 28px 0;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:15px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--line))}
.stat .v{font-size:25px;font-weight:680;letter-spacing:-.6px;line-height:1.15}
.stat .l{font-size:12.5px;color:var(--tx3);margin-top:3px}
.stat .s{font-size:11.5px;color:var(--tx3);margin-top:6px}
.bar{height:4px;background:var(--line2);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--wx);transition:.4s}

/* ---------- tabs ---------- */
.tabs{
  padding:20px 28px 0;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--line);margin-bottom:0;position:relative;
}
.tab{
  background:none;border:none;padding:9px 15px;font-size:13.5px;color:var(--tx2);
  cursor:pointer;font-family:inherit;border-radius:8px 8px 0 0;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s;
}
.tab:hover{color:var(--tx);background:var(--line2)}
.tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.legend{margin-left:auto;display:flex;gap:14px;padding-bottom:9px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tx2);cursor:default}
.lg i{width:9px;height:9px;border-radius:3px;flex:none}
.lg b{font-weight:600;color:var(--tx3);font-size:11.5px}

main{padding:22px 28px 60px}
.view{display:none}
.view.active{display:block}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.cal-head h2{font-size:19px;font-weight:650;min-width:150px;letter-spacing:-.3px}
.nav-btn{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);cursor:pointer;font-size:17px;color:var(--tx2);
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.nav-btn:hover{border-color:var(--brand);color:var(--brand)}
.weekdays{
  display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:10px;
}
.weekdays span{
  text-align:center;font-size:12.5px;color:var(--tx3);font-weight:500;padding:4px 0;
}
.weekdays .hl{color:var(--brand);font-weight:650}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.cell{
  background:var(--card);border:1px solid var(--line);border-radius:11px;
  min-height:112px;padding:9px 10px;position:relative;transition:.15s;
}
.cell.out{background:#FAFBFC;border-color:var(--line2)}
.cell.out .dn{color:#C9CFD6}
.cell.fri{border-color:#EADCD4;background:linear-gradient(180deg,#FFFCFA,#fff)}
.cell.today{border-color:var(--brand);box-shadow:0 0 0 3px rgba(200,81,27,.1)}
.dn{font-size:13px;font-weight:600;color:var(--tx2);display:flex;align-items:center;gap:5px}
.dn .lunar{font-size:10.5px;color:var(--tx3);font-weight:400}
.today .dn{color:var(--brand)}
.evt{
  margin-top:7px;border-radius:8px;padding:7px 8px;cursor:pointer;
  border-left:3px solid var(--c);background:var(--cb);transition:.15s;
}
.evt:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.evt .et{
  font-size:11.8px;font-weight:600;color:var(--tx);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.evt .eb{display:flex;align-items:center;justify-content:space-between;margin-top:5px}
.evt .etime{font-size:10.5px;color:var(--tx3)}
.evt .est{font-size:10px;padding:1px 5px;border-radius:4px;font-weight:600}
.est.done{background:#DCFCE7;color:#15803D}
.est.skip{background:#F1F2F4;color:#8A94A0}
.est.todo{background:#FEF3C7;color:#B45309}
.evt.is-extra{border-left-style:dashed}
.badge-extra{
  font-size:9.5px;background:#FFF;border:1px solid var(--line);color:var(--tx3);
  padding:0 4px;border-radius:3px;margin-left:4px;font-weight:500;
}

/* ---------- list ---------- */
.filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filter-bar input,.filter-bar select{
  padding:8px 13px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;
  font-family:inherit;background:var(--card);color:var(--tx);outline:none;
}
.filter-bar input{flex:1;min-width:220px}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--brand)}
.month-sep{
  font-size:13px;font-weight:650;color:var(--tx2);margin:22px 0 11px;
  display:flex;align-items:center;gap:10px;
}
.month-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.month-sep:first-child{margin-top:0}
.row{
  background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:14px 16px;margin-bottom:9px;display:flex;align-items:center;gap:15px;
  cursor:pointer;transition:.15s;box-shadow:var(--shadow);
}
.row:hover{border-color:#D6DBE1;transform:translateX(2px)}
.row .rd{
  width:56px;flex:none;text-align:center;padding-right:14px;border-right:1px solid var(--line2);
}
.row .rd .dd{font-size:19px;font-weight:680;letter-spacing:-.5px}
.row .rd .dw{font-size:11px;color:var(--tx3);margin-top:1px}
.row .rc{flex:1;min-width:0}
.row .rt{font-size:14px;font-weight:600;margin-bottom:3px}
.row .rh{font-size:12.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rr{display:flex;align-items:center;gap:9px;flex:none}
.cat-chip{
  display:inline-block;font-size:11.5px;padding:2.5px 9px;border-radius:6px;font-weight:600;
  background:var(--cb);color:var(--c);
}

/* ---------- guide ---------- */
.g-card{
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:24px 26px;margin-bottom:16px;box-shadow:var(--shadow);
}
.g-card h3{font-size:16px;font-weight:650;margin-bottom:4px}
.g-card .sub{font-size:12.5px;color:var(--tx3);margin-bottom:18px}
.rule{display:flex;gap:15px;padding:13px 0;border-bottom:1px solid var(--line2)}
.rule:last-child{border-bottom:none;padding-bottom:0}
.rule .rk{
  flex:none;width:88px;font-size:13px;font-weight:650;color:var(--brand);
}
.rule .rv{font-size:13.5px;color:var(--tx2);line-height:1.65}
.forbid{display:flex;flex-wrap:wrap;gap:9px;margin-top:4px}
.forbid span{
  font-size:12.5px;background:#FEF2F2;color:#B91C1C;border:1px solid #FEE2E2;
  padding:5px 11px;border-radius:7px;
}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:4px}
.pcard{border:1px solid var(--line);border-radius:11px;padding:15px 16px;background:#FCFCFD}
.pcard .pn{font-size:13.5px;font-weight:600;margin-bottom:6px}
.pcard .pp{font-size:23px;font-weight:700;color:var(--brand);letter-spacing:-.5px}
.pcard .pp small{font-size:12px;font-weight:500;color:var(--tx3);margin-left:2px}
.pcard .ps{font-size:12px;color:var(--tx3);margin-top:8px;line-height:1.6}
.svc{display:flex;flex-wrap:wrap;gap:9px;margin-top:4px}
.svc span{
  font-size:12.5px;background:#F0FDF4;color:#15803D;border:1px solid #DCFCE7;
  padding:5px 11px;border-radius:7px;
}
.cat-explain{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-top:4px}
.ce{border:1px solid var(--line);border-left-width:3px;border-radius:9px;padding:13px 15px}
.ce .cen{font-size:13.5px;font-weight:650;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.ce .cec{font-size:11.5px;color:var(--tx3);font-weight:500}
.ce .ced{font-size:12.5px;color:var(--tx2);line-height:1.6}

/* ---------- drawer ---------- */
.drawer-mask{
  position:fixed;inset:0;background:rgba(16,24,40,.35);opacity:0;visibility:hidden;
  transition:.22s;z-index:98;backdrop-filter:blur(2px);
}
.drawer-mask.on{opacity:1;visibility:visible}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:520px;max-width:94vw;background:var(--bg);
  transform:translateX(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  z-index:99;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
}
.drawer.on{transform:translateX(0)}
.drawer-head{
  background:var(--card);border-bottom:1px solid var(--line);padding:20px 24px;
  display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
}
.drawer-head h3{font-size:17px;font-weight:650;margin-top:8px;letter-spacing:-.2px}
.d-meta{font-size:12.5px;color:var(--tx3);margin-top:4px}
.close{
  background:none;border:none;font-size:26px;color:var(--tx3);cursor:pointer;
  line-height:1;padding:0 4px;flex:none;
}
.close:hover{color:var(--tx)}
.drawer-body{flex:1;overflow-y:auto;padding:18px 24px 40px}
.block{margin-bottom:20px}
.block-h{
  font-size:12.5px;font-weight:650;color:var(--tx3);margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;
  letter-spacing:.3px;
}
.btn-copy{
  background:var(--wx);color:#fff;border:none;padding:5px 13px;border-radius:7px;
  font-size:12px;cursor:pointer;font-family:inherit;font-weight:500;transition:.15s;
}
.btn-copy:hover{background:#06AD56}
.btn-copy.ok{background:#15803D}

/* 微信预览 */
.wx-preview{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#EDEDED}
.wx-bar{
  background:#F7F7F7;border-bottom:1px solid #E3E3E3;padding:9px 14px;
  text-align:center;font-size:13px;font-weight:500;color:#333;
}
.wx-body{padding:14px 12px 18px;min-height:120px}
.wx-time{text-align:center;font-size:11px;color:#9B9B9B;margin-bottom:12px}
.wx-row{display:flex;gap:9px;align-items:flex-start;justify-content:flex-end}
.wx-avatar{
  width:34px;height:34px;border-radius:5px;background:var(--brand);color:#fff;
  font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;order:2;
}
.wx-bubble{
  background:var(--wx-bubble);border-radius:5px;padding:10px 13px;position:relative;
  font-size:14.5px;line-height:1.72;color:#000;white-space:pre-wrap;word-break:break-word;
  max-width:330px;order:1;
}
.wx-bubble::after{
  content:"";position:absolute;right:-5px;top:11px;width:0;height:0;
  border:5px solid transparent;border-left-color:var(--wx-bubble);border-right:0;
}

.raw{
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
  font-family:inherit;font-size:13.5px;line-height:1.75;white-space:pre-wrap;
  color:var(--tx);word-break:break-word;
}
.asset{
  background:#FFFBEB;border:1px solid #FDE68A;border-radius:9px;padding:11px 14px;
  font-size:13px;color:#92400E;
}
.tips{list-style:none}
.tips li{
  background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:11px 14px;margin-bottom:8px;font-size:13px;color:var(--tx2);line-height:1.65;
  position:relative;padding-left:34px;
}
.tips li::before{
  content:"›";position:absolute;left:15px;top:9px;color:var(--brand);
  font-size:16px;font-weight:700;
}
.tips li.key{background:#FFF7ED;border-color:#FED7AA}
.status-btns{display:flex;gap:9px;margin-bottom:11px}
.sbtn{
  flex:1;padding:10px;border:1px solid var(--line);background:var(--card);
  border-radius:9px;cursor:pointer;font-size:13px;font-family:inherit;color:var(--tx2);
  transition:.15s;
}
.sbtn:hover{border-color:#C9CFD6}
.sbtn.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.sbtn.done.on{background:var(--wx);border-color:var(--wx)}
.sbtn.skip.on{background:#8A94A0;border-color:#8A94A0}
.note-wrap textarea{
  width:100%;min-height:76px;border:1px solid var(--line);border-radius:9px;
  padding:11px 13px;font-family:inherit;font-size:13px;resize:vertical;outline:none;
  background:var(--card);color:var(--tx);line-height:1.6;
}
.note-wrap textarea:focus{border-color:var(--brand)}

.toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--tx);color:#fff;padding:11px 22px;border-radius:9px;font-size:13.5px;
  opacity:0;visibility:hidden;transition:.22s;z-index:200;box-shadow:var(--shadow-lg);
}
.toast.on{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}

@media(max-width:1180px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .pgrid,.cat-explain{grid-template-columns:1fr}
  .legend{width:100%;margin-left:0;padding:0 0 10px}
}
@media(max-width:760px){
  .topbar{flex-direction:column;align-items:flex-start;gap:12px}
  .stats{grid-template-columns:repeat(2,1fr);padding:16px 16px 0}
  .tabs,main{padding-left:16px;padding-right:16px}
  .cell{min-height:78px;padding:6px}
  .evt .et{-webkit-line-clamp:1}
}

</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">欧</div>
    <div class="brand-txt">
      <h1>欧乐家 · 微信营销内容日历</h1>
      <p>统一话术 · 每周五 10:00 准点触达 · 面向 50-60 岁客群</p>
    </div>
  </div>
  <div class="topbar-right">
    <div class="push-status on" id="pushStatus">
      <span class="dot"></span><span id="pushTxt">推送通道已配置 · 自动化每日 09:30</span>
    </div>
    <button class="btn-ghost" id="btnExport">导出话术</button>
  </div>
</header>

<section class="stats" id="stats"></section>

<nav class="tabs">
  <button class="tab active" data-view="calendar">📅 日历视图</button>
  <button class="tab" data-view="list">📋 内容清单</button>
  <button class="tab" data-view="guide">📖 执行铁律</button>
  <div class="legend" id="legend"></div>
</nav>

<main>
  <!-- 日历视图 -->
  <section id="view-calendar" class="view active">
    <div class="cal-head">
      <button class="nav-btn" id="prevM">‹</button>
      <h2 id="monthLabel"></h2>
      <button class="nav-btn" id="nextM">›</button>
      <button class="btn-ghost sm" id="todayBtn">回到本月</button>
    </div>
    <div class="weekdays">
      <span>一</span><span>二</span><span>三</span><span>四</span>
      <span class="hl">五</span><span>六</span><span>日</span>
    </div>
    <div class="grid" id="calGrid"></div>
  </section>

  <!-- 清单视图 -->
  <section id="view-list" class="view">
    <div class="filter-bar">
      <input type="text" id="searchBox" placeholder="搜索标题或内容关键词…">
      <select id="filterCat">
        <option value="">全部板块</option>
      </select>
      <select id="filterStatus">
        <option value="">全部状态</option>
        <option value="done">已发送</option>
        <option value="todo">待发送</option>
        <option value="skip">已跳过</option>
      </select>
    </div>
    <div id="listWrap"></div>
  </section>

  <!-- 指南视图 -->
  <section id="view-guide" class="view">
    <div id="guideWrap"></div>
  </section>
</main>

<!-- 详情抽屉 -->
<div class="drawer-mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div>
      <span class="cat-chip" id="dCat"></span>
      <h3 id="dTitle"></h3>
      <p class="d-meta" id="dMeta"></p>
    </div>
    <button class="close" id="dClose">×</button>
  </div>

  <div class="drawer-body">
    <div class="block">
      <div class="block-h">微信内实际效果预览</div>
      <div class="wx-preview">
        <div class="wx-bar"><span id="wxName">客户</span></div>
        <div class="wx-body">
          <div class="wx-time" id="wxTime"></div>
          <div class="wx-row">
            <div class="wx-avatar">销</div>
            <div class="wx-bubble" id="wxBubble"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="block">
      <div class="block-h">
        话术原文
        <button class="btn-copy" id="btnCopy">复制话术</button>
      </div>
      <pre class="raw" id="dRaw"></pre>
    </div>

    <div class="block" id="assetBlock">
      <div class="block-h">配图要求</div>
      <div class="asset" id="dAsset"></div>
    </div>

    <div class="block">
      <div class="block-h">发送要点（销售必读）</div>
      <ul class="tips" id="dTips"></ul>
    </div>

    <div class="block">
      <div class="block-h">发布状态</div>
      <div class="status-btns">
        <button class="sbtn" data-st="todo">待发送</button>
        <button class="sbtn done" data-st="done">✓ 已发送</button>
        <button class="sbtn skip" data-st="skip">跳过本条</button>
      </div>
      <div class="note-wrap">
        <textarea id="dNote" placeholder="执行备注：客户反馈、回复情况、成交线索…"></textarea>
      </div>
    </div>
  </div>

(function () {
  'use strict';

  var DB = null;
  var STORE_K = 'olj_wx_cal_v1';
  var state = { cur: null, month: null, view: 'calendar' };
  var store = load();

  function load() {
    try { return JSON.parse(localStorage.getItem(STORE_K)) || {}; } catch (e) { return {}; }
  }
  function save() { localStorage.setItem(STORE_K, JSON.stringify(store)); }
  function rec(id) { return store[id] || (store[id] = { st: 'todo', note: '' }); }
  function statusOf(id) {
    var r = rec(id);
    if (r.st && r.st !== 'todo') return r.st;            // 手动标记优先（done/skip）
    if (DB && DB.pushed_ids && DB.pushed_ids.indexOf(id) >= 0) return 'done';  // 自动已发布
    return 'todo';
  }

  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('on'); }, 1900);
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var a = s.split('-'); return new Date(+a[0], +a[1] - 1, +a[2]); }
  var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  function hex2rgba(h, a) {
    var n = parseInt(h.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function catVars(cat) {
    var c = DB.cats[cat];
    return 'style="--c:' + c.color + ';--cb:' + hex2rgba(c.color, .1) + '"';
  }

  /* ============ 统计 ============ */

      byCat[it.cat] = (byCat[it.cat] || 0) + 1;
    });
    var next = items.filter(function (it) { return it.date >= today && statusOf(it.id) === 'todo'; })[0];
    var pct = items.length ? Math.round(done / items.length * 100) : 0;
    var overdue = items.filter(function (it) { return it.date < today && statusOf(it.id) === 'todo'; }).length;

      {

      },

    ];
    $('#stats').innerHTML = cards.map(function (c) {

        '<div class="v" style="color:' + c.c + '">' + c.v + '</div>' +
        '<div class="l">' + c.l + '</div>' +
        '<div class="s">' + c.s + '</div>' +
        (c.bar != null ? '<div class="bar"><i style="width:' + c.bar + '%"></i></div>' : '') +
        '</div>';
    }).join('');
  }

  /* ============ 图例 ============ */
  function renderLegend() {

      (map[k] || []).forEach(function (it) {
        var st = statusOf(it.id);
        var stTxt = st === 'done' ? '已发' : st === 'skip' ? '跳过' : '待发';
        html += '<div class="evt' + (it.kind === 'extra' ? ' is-extra' : '') + '" data-id="' + it.id + '" ' + catVars(it.cat) + '>' +
          '<div class="et">' + it.title + (it.kind === 'extra' ? '<span class="badge-extra">加发</span>' : '') + '</div>' +
          '<div class="eb"><span class="etime">' + it.time + '</span>' +
          '<span class="est ' + st + '">' + stTxt + '</span></div></div>';
      });
      html += '</div>';
    }
    $('#calGrid').innerHTML = html;
  }

  /* ============ 清单 ============ */
  function renderList() {
    var q = $('#searchBox').value.trim().toLowerCase();
    var fc = $('#filterCat').value, fs = $('#filterStatus').value;
    var rows = DB.items.filter(function (it) {
      if (fc && it.cat !== fc) return false;
      if (fs && statusOf(it.id) !== fs) return false;
      if (q && (it.title + it.hook + it.content).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    if (!rows.length) { $('#listWrap').innerHTML = '<div class="g-card" style="text-align:center;color:var(--tx3)">没有匹配的内容</div>'; return; }

    var html = '', lastM = '';
    rows.forEach(function (it) {
      var d = parse(it.date), mk = d.getFullYear() + '年' + (d.getMonth() + 1) + '月';
      if (mk !== lastM) { html += '<div class="month-sep">' + mk + '</div>'; lastM = mk; }
      var st = statusOf(it.id);
      var stTxt = st === 'done' ? '已发送' : st === 'skip' ? '已跳过' : '待发送';
      html += '<div class="row" data-id="' + it.id + '">' +
        '<div class="rd"><div class="dd">' + d.getDate() + '</div><div class="dw">' + WD[d.getDay()] + '</div></div>' +
        '<div class="rc"><div class="rt">' + it.title + (it.kind === 'extra' ? '<span class="badge-extra">加发</span>' : '') + '</div>' +
        '<div class="rh">' + it.hook + '</div></div>' +
        '<div class="rr"><span class="cat-chip" ' + catVars(it.cat) + '>' + DB.cats[it.cat].name + '</span>' +
        '<span class="est ' + st + '" style="font-size:11px;padding:3px 8px;border-radius:5px">' + stTxt + '</span></div></div>';
    });
    $('#listWrap').innerHTML = html;
  }

  /* ============ 指南 ============ */
  function renderGuide() {
    var g = DB.guide, m = DB.meta;
    var h = '';
    h += '<div class="g-card"><h3>' + g.title + '</h3>' +
      '<p class="sub">这套规则是所有话术的底层。销售可以不背话术，但必须遵守这 ' + g.rules.length + ' 条。</p>' +
      g.rules.map(function (r) {
        return '<div class="rule"><div class="rk">' + r.k + '</div><div class="rv">' + r.v + '</div></div>';
      }).join('') + '</div>';

    h += '<div class="g-card"><h3>绝对禁用清单</h3>' +
      '<p class="sub">出现以下任意一项，这条消息就废了 —— 客户会立刻判定为「群发广告」。</p>' +
      '<div class="forbid">' + g.forbidden.map(function (f) { return '<span>' + f + '</span>'; }).join('') + '</div></div>';

    h += '<div class="g-card"><h3>四大内容板块</h3>' +
      '<p class="sub">全年配比经过设计：关系维护型内容占 66%，销售型内容仅占 16%，这是老年客群不屏蔽你的前提。</p>' +
      '<div class="cat-explain">' + Object.keys(DB.cats).map(function (k) {
        var c = DB.cats[k], n = DB.items.filter(function (i) { return i.cat === k; }).length;
        return '<div class="ce" style="border-left-color:' + c.color + '">' +
          '<div class="cen"><span style="color:' + c.color + '">' + c.name + '</span>' +
          '<span class="cec">' + n + ' 条 · ' + Math.round(n / DB.items.length * 100) + '%</span></div>' +
          '<div class="ced">' + c.desc + '</div></div>';
      }).join('') + '</div></div>';

    h += '<div class="g-card"><h3>产品与价格（铁律，不得改动）</h3>' +
      '<p class="sub">任何话术中出现的价格必须与此处逐字一致。</p>' +
      '<div class="pgrid">' + m.products.map(function (p) {
        return '<div class="pcard"><div class="pn">' + p.n + '</div>' +
          '<div class="pp">¥' + p.p + '</div>' +
          '<div class="ps">' + p.sell + '</div></div>';
      }).join('') + '</div>' +
      '<div style="margin-top:20px"><div class="block-h" style="margin-bottom:9px">服务承诺（信任闭环）</div>' +
      '<div class="svc">' + m.service.map(function (s) { return '<span>' + s + '</span>'; }).join('') + '</div></div></div>';

    h += '<div class="g-card"><h3>周五执行流程</h3><p class="sub">四个销售统一动作，10:00 准点发出。</p>' +
      ['09:30 　话术自动推送到企业微信群，销售提前打开确认',
        '09:40 　按名单准备称呼（张哥/李孃孃/王叔），需配图的先存好图',
        '10:00 　准点发出，逐个发送，不要用群发助手（会被识别）',
        '10:00-12:00　必须在线，客户回复 30 分钟内响应',
        '当天下班前　在本系统标记「已发送」并填写客户反馈备注'
      ].map(function (s, i) {
        return '<div class="rule"><div class="rk">STEP ' + (i + 1) + '</div><div class="rv">' + s + '</div></div>';
      }).join('') + '</div>';

    $('#guideWrap').innerHTML = h;
  }

  /* ============ 抽屉 ============ */
  function openDrawer(id) {
    var it = DB.items.filter(function (x) { return x.id === id; })[0];
    if (!it) return;
    state.cur = it;
    var r = rec(id), d = parse(it.date), c = DB.cats[it.cat];

    $('#dCat').textContent = c.name;
    $('#dCat').setAttribute('style', '--c:' + c.color + ';--cb:' + hex2rgba(c.color, .1));
    $('#dTitle').textContent = it.title;
    $('#dMeta').textContent = it.date + ' ' + WD[d.getDay()] + ' ' + it.time +
      ' 　·　 ' + (it.kind === 'extra' ? '节日加发（短版）' : '周五主推') + ' 　·　 ' + it.hook;

    $('#wxName').textContent = '张孃孃';
    $('#wxTime').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + it.time;
    $('#wxBubble').textContent = it.content.replace(/\{称呼\}/g, '张孃孃').replace(/\{销售名\}/g, '小李').replace(/\{小区名\}/g, '龙湖春森彼岸');
    $('#dRaw').textContent = it.content;

    if (it.asset) { $('#assetBlock').style.display = ''; $('#dAsset').textContent = '📷 ' + it.asset; }
    else { $('#assetBlock').style.display = 'none'; }

    $('#dTips').innerHTML = it.tips.map(function (t) {
      return '<li class="' + (t.indexOf('★') === 0 ? 'key' : '') + '">' + t + '</li>';
    }).join('');

    $$('.sbtn').forEach(function (b) { b.classList.toggle('on', b.dataset.st === r.st); });
    $('#dNote').value = r.note || '';

    $('#mask').classList.add('on');
    $('#drawer').classList.add('on');
  }
  function closeDrawer() {
    if (state.cur) { rec(state.cur.id).note = $('#dNote').value; save(); }
    $('#mask').classList.remove('on'); $('#drawer').classList.remove('on');
    state.cur = null; refresh();
  }

  /* ============ 导出 ============ */
  function exportTxt() {
    var lines = ['重庆欧乐家厨电 · 微信营销话术全集',
      '排期 ' + DB.meta.range + ' 　共 ' + DB.items.length + ' 条',
      '发送节奏：' + DB.meta.cadence,
      '导出时间：' + new Date().toLocaleString('zh-CN'),
      '\n发送前务必替换：{称呼} → 客户真实称呼　{销售名} → 你的名字　{小区名} → 真实小区',
      '\n' + '='.repeat(46) + '\n'];
    DB.items.forEach(function (it, i) {
      var d = parse(it.date);
      lines.push('【' + (i + 1) + '】' + it.date + ' ' + WD[d.getDay()] + ' ' + it.time +
        '　[' + DB.cats[it.cat].name + ']' + (it.kind === 'extra' ? '[节日加发]' : ''));
      lines.push('主题：' + it.title + '　（' + it.hook + '）');
      if (it.asset) lines.push('配图：' + it.asset);
      lines.push('-'.repeat(46));
      lines.push(it.content);
      lines.push('-'.repeat(46));
      lines.push('发送要点：');
      it.tips.forEach(function (t) { lines.push('  · ' + t); });
      lines.push('\n' + '='.repeat(46) + '\n');
    });
    var blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '欧乐家_微信营销话术全集_' + DB.meta.range.replace(/-/g, '') + '.txt';
    a.click(); URL.revokeObjectURL(a.href);
    toast('已导出 ' + DB.items.length + ' 条话术');
  }

  /* ============ 推送状态 ============ */
  function checkPush() {
    fetch('data/push_status.json?t=' + Date.now()).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (j && j.configured) {
          $('#pushStatus').classList.add('on');
          $('#pushTxt').textContent = j.last_push
            ? '企微推送已开启 · 上次 ' + j.last_push
            : '企微推送已开启 · 每周五 09:30';
        }
      }).catch(function () { });
  }

  function refresh() {
    renderStats();
    if (state.view === 'calendar') renderCal();
    if (state.view === 'list') renderList();
  }

  /* ============ 事件 ============ */
  function bind() {
    $$('.tab').forEach(function (t) {
      t.onclick = function () {
        $$('.tab').forEach(function (x) { x.classList.remove('active'); });
        t.classList.add('active');
        state.view = t.dataset.view;
        $$('.view').forEach(function (v) { v.classList.remove('active'); });
        $('#view-' + state.view).classList.add('active');
        refresh();
      };
    });
    $('#prevM').onclick = function () { state.month.setMonth(state.month.getMonth() - 1); renderCal(); };
    $('#nextM').onclick = function () { state.month.setMonth(state.month.getMonth() + 1); renderCal(); };
    $('#todayBtn').onclick = function () { state.month = new Date(); renderCal(); };

    document.addEventListener('click', function (e) {
      var evt = e.target.closest('.evt,.row');
      if (evt && evt.dataset.id) openDrawer(evt.dataset.id);
    });
    $('#mask').onclick = closeDrawer;
    $('#dClose').onclick = closeDrawer;
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });

    $$('.sbtn').forEach(function (b) {
      b.onclick = function () {
        if (!state.cur) return;
        rec(state.cur.id).st = b.dataset.st; save();
        $$('.sbtn').forEach(function (x) { x.classList.toggle('on', x === b); });
        renderStats();
        toast(b.dataset.st === 'done' ? '已标记为「已发送」' : b.dataset.st === 'skip' ? '已跳过本条' : '已恢复为待发送');
      };
    });
    $('#dNote').onblur = function () { if (state.cur) { rec(state.cur.id).note = this.value; save(); } };

    $('#btnCopy').onclick = function () {
      if (!state.cur) return;
      var btn = this;
      navigator.clipboard.writeText(state.cur.content).then(function () {
        btn.textContent = '✓ 已复制'; btn.classList.add('ok');
        toast('话术已复制，记得替换称呼和落款');
        setTimeout(function () { btn.textContent = '复制话术'; btn.classList.remove('ok'); }, 2000);
      });
    };
    $('#btnExport').onclick = exportTxt;
    $('#searchBox').oninput = renderList;
    $('#filterCat').onchange = renderList;
    $('#filterStatus').onchange = renderList;
  }

  /* ============ 启动 ============ */
  function boot(j) {
    DB = j;
    var today = new Date();
    var firstPending = DB.items.filter(function (it) { return it.date >= ymd(today); })[0];
    state.month = firstPending ? parse(firstPending.date) : today;
    renderLegend(); renderGuide(); bind(); refresh(); checkPush();
  }
  if (window.__DATA__) {
    boot(window.__DATA__);
  } else {
    fetch('data/content.json?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(boot)
      .catch(function (e) {
        document.querySelector('main').innerHTML =
          '<div class="g-card"><h3>内容库加载失败</h3><p class="sub">请通过本地服务访问（不要直接双击打开 html 文件）。</p></div>';
        console.error(e);
      });
  }
})();

</script>
</body>
</html>
