name: 欧乐家微信营销推送

on:
  schedule:
    - cron: '30 1 * * *'   # 北京 09:30 = UTC 01:30，发当天任务卡 + 话术
    - cron: '0 9 * * *'    # 北京 17:00 = UTC 09:00，发明日群发预告
  workflow_dispatch:        # 允许在 Actions 页面手动点一下运行（调试用）
    inputs:
      mode:
        description: 'push=发当天内容 / remind=发明日预告'
        required: false
        default: 'push'

permissions:
  contents: write          # 允许 workflow 把“已发送状态”写回仓库

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 发送
        env:
          WEBHOOK: ${{ secrets.WEBHOOK }}
          TZ: Asia/Shanghai
        run: |
          # 优先级：手动输入的 mode > 定时规则判断
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            if [ "${{ github.event.inputs.mode }}" = "remind" ]; then
              MODE="--remind"
            else
              MODE=""
            fi
          elif [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then
            # 17:00(UTC 09:00) 那条定时 → 预告模式
            MODE="--remind"
          else
            MODE=""
          fi
          python push/push.py $MODE

      - name: 写回已发送状态
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wechat-calendar/data/pushed_ids.json
          if git diff --cached --quiet; then
            echo "无状态变更，跳过提交"
          else
            git commit -m "chore: 写回已发送状态 [skip ci]"
            git push
          fi
