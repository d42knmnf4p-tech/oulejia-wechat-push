name: 欧乐家微信营销推送

on:
  schedule:
    - cron: '30 1 * * *'   # 北京 09:30 = UTC 01:30，发当天任务卡 + 话术
    - cron: '0 9 * * *'    # 北京 17:00 = UTC 09:00，发明日群发预告
  workflow_dispatch:        # 允许在 Actions 页面手动点一下运行（调试用）

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 发送
        env:
          WEBHOOK: ${{ secrets.WEBHOOK }}
          TZ: Asia/Shanghai
        run: |
          # 17:00(UTC 09:00) 那条定时 → 预告模式；其余（09:30 / 手动）→ 发送当天
          if [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then
            MODE="--remind"
          else
            MODE=""
          fi
          python push/push.py $MODE
